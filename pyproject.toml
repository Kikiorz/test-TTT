[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "test-ttt"
version = "0.1.0"
description = "Causal test-time training modules for DP and DiT robot action policies"
requires-python = ">=3.10"
dependencies = [
  "dill>=0.3.8",
  "einops>=0.7",
  "hydra-core>=1.3",
  "numpy>=1.24",
  "torch>=2.4",
  "torchvision>=0.19",
]

[tool.setuptools]
package-dir = {"" = "policy"}
packages = ["DP_TTT", "DiT", "DiT_TTT"]
