[program:rmbench_prune_cover_blocks_checkpoints]
environment=PROC_NAME="%(program_name)s",DISABLE_PTY="true"
command=/opt/supervisor-scripts/rmbench_prune_cover_blocks_checkpoints.sh
directory=/workspace
autostart=false
autorestart=false
exitcodes=0
startsecs=2
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/workspace/logs/rmbench_prune_cover_blocks_checkpoints.log
redirect_stderr=true
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=1
