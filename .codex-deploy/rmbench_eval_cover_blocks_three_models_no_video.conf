[program:rmbench_eval_cover_blocks_three_models_no_video]
environment=PROC_NAME="%(program_name)s",DISABLE_PTY="true",PYTHONUNBUFFERED="1"
command=/opt/supervisor-scripts/rmbench_eval_cover_blocks_three_models_no_video.sh
directory=/workspace
