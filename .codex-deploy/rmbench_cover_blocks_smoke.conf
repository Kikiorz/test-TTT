[program:rmbench_cover_blocks_smoke]
environment=PROC_NAME="%(program_name)s",DISABLE_PTY="true",CUDA_VISIBLE_DEVICES="0",PYTHONDONTWRITEBYTECODE="1",PYTHONFAULTHANDLER="1",TORCH_EXTENSIONS_DIR="/workspace/torch_extensions"
command=/workspace/RMBench/.venv-sim/bin/python /workspace/RMBench/rmbench_cover_blocks_smoke.py
directory=/workspace/RMBench
autostart=false
autorestart=false
exitcodes=0
startsecs=1
stopasgroup=true
killasgroup=true
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/workspace/logs/rmbench_cover_blocks_smoke.log
redirect_stderr=true
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=2
